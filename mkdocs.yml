          - Data Pipeline (AI Generated): data-core/integration/data-pipeline-ai-generated/index.md
          - Data Streaming: data-core/integration/data-streaming/index.md
          - Data Observability: data-core/integration/data-observability/index.md

      - Intelligence:
          - Overview: data-core/intelligence/index.md
          - Data Quality: data-core/intelligence/data-quality/index.md
          - Data Lineage: data-core/intelligence/data-lineage/index.md
          - Text2SQL: data-core/intelligence/text2sql/index.md

      - Retrieval:
