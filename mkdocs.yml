site_name: IBM Building Blocks Documentation
site_description: Modular IBM Building Blocks Documentation
site_url: https://ibm-self-serve-assets.github.io/building-blocks/

docs_dir: docs-src

theme:
  name: material
  custom_dir: docs-src/overrides

  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer 
    - content.code.copy
    - search.highlight
    - search.share
    - header.autohide

  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/carbon.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - AI:
      - Agents:
          - Overview: ai-core/agents/index.md
          - Agent Builder: ai-core/agents/agent-builder.md
          - Agent Gateway: ai-core/agents/ai-gateway.md
          - Multi-Agent Orchestration: ai-core/agents/multi-agent-orchestration.md
          
      - Trusted AI:
          - Overview: ai-core/trust/index.md
          - Design-Time Evaluations: ai-core/trust/design-time-evaluations.md
          - Runtime Monitoring: ai-core/trust/run-time-monitoring.md
          - Compliance Accelerators: ai-core/trust/compliance-accelerators.md


      - Data:
          - Overview: ai-core/data/index.md
          - Question & Answer: ai-core/data/q-and-a.md
          - Data Ingestion: ai-core/data/data-ingestion.md
          - Zero-Copy Lakehouse: ai-core/data/zero-copy-lakehouse.md
          - Vector Search:
              - Overview: ai-core/data/vector-search/index.md
              - Milvus: ai-core/data/vector-search/milvus.md
              - OpenSearch: ai-core/data/vector-search/opensearch.md
              - DataStax Astra DB: ai-core/data/vector-search/datastax-astra-db.md
          - Data Security and Encryption: ai-core/data/data-security-and-encryption.md

  - Automation:
      - Build and Deploy:
          - Overview: automation-core/build/index.md
          - iPaaS: automation-core/build/ipaas.md
          - Authentication Management: automation-core/build/authentication-management.md
          - Infrastructure as Code: automation-core/build/infrastructure-as-code.md
          - Quantum-Safe Cryptography: automation-core/build/quantum-safe.md

      - Modernize:
