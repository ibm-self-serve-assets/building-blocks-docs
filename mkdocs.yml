site_name: IBM Building Blocks Documentation
site_description: Modular IBM Building Blocks Documentation
site_url: https://ibm-self-serve-assets.github.io/building-blocks/

docs_dir: docs-src

theme:
  name: material
  custom_dir: docs-src/overrides

  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.share
    - header.autohide

  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/carbon.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Building Blocks:
      - Overview: index.md
  - AI:
      - Agents:
          - Overview: ai-core/agents/index.md
          - Agent Builder: ai-core/agents/agent-builder.md
          - Multi-Agent Orchestration: ai-core/agents/multi-agent-orchestration.md
          - Agentic SDLC: ai-core/agents/agentic-sdlc.md

      - AI Trust:
