site_name: Bob+ IBM Technology Building Blocks Docs
site_description: Bob+ IBM Technology Building Blocks Documentation
site_url: https://ibm-self-serve-assets.github.io/building-blocks/

docs_dir: docs-src

theme:
  name: material
  custom_dir: docs-src/overrides

  features:
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.share
    - header.autohide

  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/carbon.css
  - ibm-bob/skills/skills.css

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js

plugins:
  - search
  - redirects:
      # Section renamed from AI Trust to AI Control Plane — keep old URLs working
      redirect_maps:
        'ai-core/ai-trust/index.md': 'ai-core/ai-control-plane/index.md'
        'ai-core/ai-trust/agent-ops.md': 'ai-core/ai-control-plane/agent-ops.md'
        'ai-core/ai-trust/ai-compliance.md': 'ai-core/ai-control-plane/ai-compliance.md'
        'ai-core/ai-trust/ai-cost-management.md': 'ai-core/ai-control-plane/ai-cost-management.md'
        'ai-core/ai-trust/lifecycle-management.md': 'ai-core/ai-control-plane/lifecycle-management.md'
        'ai-core/ai-trust/shadow-ai-discovery.md': 'ai-core/ai-control-plane/shadow-ai-discovery.md'
        'ai-core/ai-trust/model-evaluation.md': 'ai-core/ai-control-plane/model-evaluation.md'
        'ai-core/ai-trust/real-time-guardrails.md': 'ai-core/ai-control-plane/real-time-guardrails.md'
        # Data Building Blocks re-architecture redirects
        'data-core/context/index.md': 'data-core/streamhouse/index.md'
        'data-core/context/streamhouse/index.md': 'data-core/streamhouse/index.md'
        'data-core/context/context-hub/index.md': 'data-core/streamhouse/serve/index.md'
        'data-core/context/metadata-enrichment/index.md': 'data-core/lakehouse/metadata-enrichment/index.md'
        'data-core/context/data-observability/index.md': 'data-core/lakehouse/data-observability/index.md'
        'data-core/query-engines/index.md': 'data-core/lakehouse/index.md'
        'data-core/query-engines/zero-copy-lakehouse/index.md': 'data-core/lakehouse/zero-copy-lakehouse/index.md'
        'data-core/query-engines/serverless-vector/index.md': 'data-core/lakehouse/serverless-vector/index.md'

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - IBM Bob+: index.md
      
  - AI:
      - Overview: ai-core/index.md
      - Agents:
          - Overview: ai-core/agents/index.md
          - Agent Builder: ai-core/agents/agent-builder.md
          - Multi-Agent Orchestration: ai-core/agents/multi-agent-orchestration.md

      - AI Control Plane:
          - Overview: ai-core/ai-control-plane/index.md
          - Agent Ops: ai-core/ai-control-plane/agent-ops.md
          - AI Cost Management: ai-core/ai-control-plane/ai-cost-management.md
          - AI Compliance: ai-core/ai-control-plane/ai-compliance.md
          # Hidden for now — uncomment to restore:
          # - Lifecycle Management: ai-core/ai-control-plane/lifecycle-management.md
          # - Shadow AI Discovery: ai-core/ai-control-plane/shadow-ai-discovery.md
          # - Model Evaluation: ai-core/ai-control-plane/model-evaluation.md
          # - Real-Time Guardrails: ai-core/ai-control-plane/real-time-guardrails.md

      - AI Engineering:
          - Overview: ai-core/ai-engineering/index.md
          - Agentic SDLC: ai-core/ai-engineering/agentic-sdlc.md
          - Code Modernization: ai-core/ai-engineering/code-modernization.md
          - Headless Bob: ai-core/ai-engineering/headless-bob.md
          - Integration as Code: ai-core/ai-engineering/integration-as-code.md

      - Skills and Modes: ai-core/bob-skills-and-modes.md

  - Data:
      - Overview: data-core/index.md

      - Streamhouse:
          - Overview: data-core/streamhouse/index.md
          - Real-Time streaming: data-core/streamhouse/real-time-streaming/index.md
          - Transform: data-core/streamhouse/transform/index.md
          - Govern: data-core/streamhouse/govern/index.md
          - Serve: data-core/streamhouse/serve/index.md

      - Pipelines:
          - Overview: data-core/pipelines/index.md
          - RAG: data-core/pipelines/rag/index.md
          - UDI: data-core/pipelines/udi/index.md
          - Text2SQL: data-core/pipelines/text2sql/index.md
          - ETL: data-core/pipelines/etl/index.md
          - Data Sync: data-core/pipelines/data-sync/index.md

      - Lakehouse:
          - Overview: data-core/lakehouse/index.md
          - Meta Data Enrichment and Quality: data-core/lakehouse/metadata-enrichment/index.md
          - Data Observability: data-core/lakehouse/data-observability/index.md
          - Zero-Copy Lakehouse: data-core/lakehouse/zero-copy-lakehouse/index.md
          - Serverless Vector: data-core/lakehouse/serverless-vector/index.md

      - Skills and Modes: data-core/bob-skills-and-modes.md

  - Automation:
      - Overview: automation-core/index.md

      - Operate:
          - Overview: automation-core/operate/index.md
          - Infrastructure as Code: automation-core/operate/infrastructure-as-code.md
          - Configure & Automate: automation-core/operate/configure-automate.md
          - Workload Orchestration & Scheduling: automation-core/operate/workload-orchestration.md

      - Secure:
          - Overview: automation-core/secure/index.md
          - Non-human Identity & Secret Management: automation-core/secure/non-human-identity.md
          - Application Risk & Continuous Compliance: automation-core/secure/application-risk.md
          - Cryptographic & Quantum-Safe Readiness: automation-core/secure/cryptographic-readiness.md

      - Optimize:
          - Overview: automation-core/optimize/index.md
          - Full-Stack Application Observability: automation-core/optimize/full-stack-observability.md
          - Application Performance: automation-core/optimize/application-performance.md
          - Technology Financial Management & FinOps: automation-core/optimize/technology-financial-management.md
          - Network Performance Management: automation-core/optimize/network-performance.md

      - Skills and Modes: automation-core/bob-skills-and-modes.md

  - Bob+ Extension:
      - Extension Installation Guide: ibm-bob/extension/install.md

  - Connect with us:
      - Build with Bob Workshops: workshop/index.md
      - Build with Bob Webinars: build-with-bob/index.md
